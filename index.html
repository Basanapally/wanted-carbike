<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wanted CarBike | Home</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #ff4d4d; --dark: #121212; --glass: rgba(0,0,0,0.85); }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            z-index: 2000;
            background: var(--glass);
            backdrop-filter: blur(10px);
        }

        .brand { display: flex; align-items: center; gap: 8px; color: white; text-decoration: none; }
        .logo-img { height: 35px; border-radius: 5px; }
        .brand-text { font-weight: 700; font-size: 0.9rem; }

        .nav-links { display: flex; gap: 6px; }
        .nav-btn {
            color: white;
            text-decoration: none;
            padding: 7px 10px;
            border-radius: 20px;
            border: 1px solid white;
            font-size: 0.7rem;
        }

        .reg-btn { background: var(--primary); border-color: var(--primary); }
        .post-btn { background: #4dff88; color: black; border-color: #4dff88; }
        .logout-btn { border-color: #888; color: #888; background: none; cursor: pointer; }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
            url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&q=80');
            background-size: cover;
            height: 45vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .category-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 90%;
            max-width: 400px;
        }

        .cat-card {
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            text-decoration: none;
            color: white;
        }

        .ads-section { padding: 20px 12px; }
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .ad-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
        }

        .ad-img { width: 100%; height: 120px; object-fit: cover; }
        .ad-info { padding: 10px; }
        .ad-price { color: var(--primary); font-weight: bold; }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="brand">
        <img src="logowbc.jpg" class="logo-img">
        <span class="brand-text">WANTED CARBIKE</span>
    </a>

    <div class="nav-links">
        <div id="guestLinks">
            <a href="login.html" class="nav-btn">Login</a>
            <a href="register.html" class="nav-btn reg-btn">Register</a>
        </div>

        <div id="userLinks" style="display:none;">
            <a href="post-ad.html" class="nav-btn post-btn">+ Post</a>
            <button onclick="logout()" class="nav-btn logout-btn">Logout</button>
        </div>
    </div>
</nav>

<div class="hero">
    <h1>Find Your Perfect Ride</h1>

    <div class="category-container">
        <a href="cars.html" class="cat-card">🚗<br>CARS</a>
        <a href="bikes.html" class="cat-card">🏍️<br>BIKES</a>
    </div>
</div>

<div class="ads-section">
    <h2>LATEST LISTINGS</h2>
    <div class="ads-grid" id="adsGrid">Loading...</div>
</div>

<!-- MAIN FIREBASE SCRIPT -->
<script type="module">
import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getDatabase, ref, set, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTl1dj4F-We96czvRrLEptlAWKM2n5ubk",
    authDomain: "wanted-carbike-62581.firebaseapp.com",
    projectId: "wanted-carbike-62581",
    storageBucket: "wanted-carbike-62581.firebasestorage.app",
    messagingSenderId: "537372034018",
    appId: "1:537372034018:web:ffb3999335b29407dbafbb"
};

// Initialize once
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rdb = getDatabase(app);

// Auth UI toggle
onAuthStateChanged(auth, (user) => {
    document.getElementById('guestLinks').style.display = user ? 'none' : 'block';
    document.getElementById('userLinks').style.display = user ? 'block' : 'none';

    if (user) {
        const statusRef = ref(rdb, '/status/' + user.uid);

        set(statusRef, {
            state: 'online',
            last_changed: serverTimestamp()
        });

        onDisconnect(statusRef).set({
            state: 'offline',
            last_changed: serverTimestamp()
        });
    }
});

// Fetch Ads (Optimized)
async function fetchAds() {
    const grid = document.getElementById('adsGrid');

    try {
        const snap = await getDocs(collection(db, "ads"));

        if (snap.empty) {
            grid.innerHTML = '<p>No ads yet</p>';
            return;
        }

        let html = "";

        snap.forEach(doc => {
            const data = doc.data();
            const img = data.photos?.[0] || 'https://via.placeholder.com/300';

            html += `
                <a href="product-details.html?id=${doc.id}">
                    <div class="ad-card">
                        <img src="${img}" class="ad-img">
                        <div class="ad-info">
                            <div class="ad-price">RS ${data.price}</div>
                            <div>${data.brand} ${data.model}</div>
                        </div>
                    </div>
                </a>`;
        });

        grid.innerHTML = html;

    } catch (e) {
        console.error(e);
        grid.innerHTML = "Error loading ads";
    }
}

// Logout
window.logout = () => {
    signOut(auth).then(() => location.reload());
};

fetchAds();
</script>

</body>
</html>
