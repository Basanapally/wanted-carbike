<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Wanted CarBike</title>
    <style>
        :root { --primary: #ff4d4d; --dark-bg: #020617; --card-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: var(--primary); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #cc3d3d; }
        button:disabled { background: #555; cursor: not-allowed; }
        .links { margin-top: 15px; font-size: 0.9rem; color: #aaa; }
        .links a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Wanted CarBike</h2>
    <p>Login to manage your ads</p>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Login Now</button>
    </form>
    <div class="links">
        Don't have an account? <a href="signup.html">Sign Up</a><br><br>
        <a href="index.html" style="color:#666">← Back to Home</a>
    </div>
</div>

<script type="module">
    // 1. Import Firebase Modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 2. Your Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDTl1dj4F-We96czvRrLEptlAWKM2n5ubk",
        authDomain: "wanted-carbike-62581.firebaseapp.com",
        projectId: "wanted-carbike-62581",
        storageBucket: "wanted-carbike-62581.firebasestorage.app",
        messagingSenderId: "537372034018",
        appId: "1:537372034018:web:ffb3999335b29407dbafbb"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 4. Security: If user is ALREADY logged in, send them to dashboard immediately
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "dashboard.html";
        }
    });

    // 5. Handle Login Form Submission
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Visual loading state
        loginBtn.innerText = "Authenticating...";
        loginBtn.disabled = true;

        // Firebase Sign In
        signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                // SUCCESS: Redirect to Dashboard
                console.log("Login successful!");
                window.location.href = "dashboard.html";
            })
            .catch((error) => {
                // FAILURE: Reset button and show error
                loginBtn.innerText = "Login Now";
                loginBtn.disabled = false;
                
                let errorMsg = "Login failed.";
                if (error.code === 'auth/user-not-found') errorMsg = "No user found with this email.";
                if (error.code === 'auth/wrong-password') errorMsg = "Incorrect password.";
                
                alert(errorMsg);
                console.error(error.message);
            });
    });
</script>

</body>
</html>
